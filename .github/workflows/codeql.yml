name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Swift needs the Apple silicon runner (same as ci.yml); workflow files need no build.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: swift
            build-mode: manual
            runner: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Xcode 27 and assert toolchain
        if: matrix.language == 'swift'
        run: |
          # Highest release Xcode 27.x; betas and release candidates are never used.
          XCODE="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE" ]; then
            echo "error: expected a release Xcode 27.x on this runner image, found:" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          SWIFT_VERSION="$(swift --version 2>&1)"
          echo "$SWIFT_VERSION"
          if ! printf '%s\n' "$SWIFT_VERSION" | grep -qE 'Swift version 6\.4([^0-9]|$)'; then
            echo "error: expected Swift 6.4 from $XCODE, got: $(printf '%s\n' "$SWIFT_VERSION" | head -n 1)" >&2
            exit 1
          fi
          ARCH="$(uname -m)"
          if [ "$ARCH" != "arm64" ]; then
            echo "error: expected an arm64 runner, got $ARCH" >&2
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build
        if: matrix.language == 'swift'
        run: swift build --arch arm64

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: "/language:${{ matrix.language }}"
