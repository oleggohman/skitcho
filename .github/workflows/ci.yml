name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # Apple silicon runner only; never an Intel image.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 27 and assert toolchain
        run: |
          # Highest release Xcode 27.x; betas and release candidates are never used.
          XCODE="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE" ]; then
            echo "error: expected a release Xcode 27.x on this runner image, found:" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          SWIFT_VERSION="$(swift --version 2>&1)"
          echo "$SWIFT_VERSION"
          if ! printf '%s\n' "$SWIFT_VERSION" | grep -qE 'Swift version 6\.4([^0-9]|$)'; then
            echo "error: expected Swift 6.4 from $XCODE, got: $(printf '%s\n' "$SWIFT_VERSION" | head -n 1)" >&2
            exit 1
          fi
          ARCH="$(uname -m)"
          if [ "$ARCH" != "arm64" ]; then
            echo "error: expected an arm64 runner, got $ARCH" >&2
            exit 1
          fi

      - name: Workflow and script checks
        run: scripts/test-workflows.sh

      - name: Build
        run: swift build --arch arm64

      - name: Lint
        run: swift format lint --strict --recursive Sources Tests

      - name: Test
        run: swift test --arch arm64 --no-parallel

      - name: Bundle checks
        run: scripts/test-bundle.sh

      - name: Release dry run (throwaway key, fixture feed, no notarization)
        run: scripts/test-bundle.sh --release-dry-run
