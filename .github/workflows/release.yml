name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# One release at a time; a queued tag waits instead of racing the feed (releases/latest).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Apple silicon runner only; never an Intel image.
    runs-on: macos-26
    # Bounds a hung notarization or upload; the signing keychain is deleted in the always() step.
    timeout-minutes: 90
    # Protected environment: required reviewer, deployment tags v* only, environment-scoped secrets
    # (see docs/RELEASING.md).
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not an ancestor of origin/main" >&2
            exit 1
          fi

      - name: Select Xcode 27 and assert toolchain
        run: |
          # Highest release Xcode 27.x; betas and release candidates are never used.
          XCODE="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE" ]; then
            echo "error: expected a release Xcode 27.x on this runner image, found:" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          SWIFT_VERSION="$(swift --version 2>&1)"
          echo "$SWIFT_VERSION"
          if ! printf '%s\n' "$SWIFT_VERSION" | grep -qE 'Swift version 6\.4([^0-9]|$)'; then
            echo "error: expected Swift 6.4 from $XCODE, got: $(printf '%s\n' "$SWIFT_VERSION" | head -n 1)" >&2
            exit 1
          fi
          ARCH="$(uname -m)"
          if [ "$ARCH" != "arm64" ]; then
            echo "error: expected an arm64 runner, got $ARCH" >&2
            exit 1
          fi

      - name: Test
        run: swift test --arch arm64 --no-parallel

      - name: Import signing certificate and notarization key
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_PRIVATE_KEY: ${{ secrets.ApplePrivateKey }}
          APPLE_IDENTITY: ${{ secrets.AppleIDENTITY }}
        run: |
          umask 077
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          P8_PATH="$RUNNER_TEMP/AuthKey.p8"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$APPLE_PRIVATE_KEY" > "$P8_PATH"
          KC_PW="$(openssl rand -base64 32)"
          EXISTING="$(security list-keychains -d user | tr -d '"')"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN" > /dev/null
          # Unquoted on purpose: EXISTING is a whitespace-separated keychain list.
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING
          {
            echo "ASC_KEY_PATH=$P8_PATH"
            echo "SIGN_IDENTITY=$APPLE_IDENTITY"
          } >> "$GITHUB_ENV"

      # release.sh validates every input before building, and un-exports the secrets so only
      # generate_appcast (stdin) and notarytool (arguments) receive them.
      - name: Build, sign, notarize and prepare appcast
        env:
          AppleStoreAPIKey: ${{ secrets.AppleStoreAPIKey }}
          AppleIssuerID: ${{ secrets.AppleIssuerID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"

      # gh uploads the assets to a draft and publishes it afterwards, so the feed never points at a
      # release without its DMG. release.sh guarantees this version is the highest, hence --latest.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Skitcho-*.dmg dist/appcast.xml \
            --generate-notes --verify-tag --latest

      - name: Clean up keychain and key files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
