name: Trivy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 3"

permissions: {}

jobs:
  scan:
    name: Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      # Pinned Trivy binary (aquasecurity/trivy-action is not allowed by the repo's Actions policy).
      # TRIVY_SHA256 is the value published in trivy_0.76.2_checksums.txt for the Linux-64bit tarball;
      # update both together and never derive the checksum at runtime.
      TRIVY_VERSION: "0.76.2"
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Trivy
        run: |
          curl -fsSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf trivy.tgz -C "$RUNNER_TEMP/bin" trivy
          rm trivy.tgz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Trivy scan (SARIF, report only)
        run: trivy fs --scanners vuln,secret,misconfig --ignore-unfixed --format sarif -o trivy-results.sarif --exit-code 0 .

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Trivy scan (fail on HIGH or CRITICAL)
        run: trivy fs --scanners vuln,secret,misconfig --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 .
